<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>City Weather Pipeline</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header>
    <p class="eyebrow">city-weather-pipeline</p>
    <h1>Daily city weather</h1>
    <p class="lede">Curated Open-Meteo stats from the batch pipeline. UI is a thin read layer.</p>
  </header>

  <section class="controls">
    <label>
      City
      <select id="city"></select>
    </label>
    <p id="meta" class="meta" aria-live="polite"></p>
  </section>

  <section class="chart-panel">
    <canvas id="tempChart" height="120"></canvas>
  </section>

  <section>
    <h2>Latest days</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Mean °C</th>
            <th>7d avg</th>
            <th>30d anomaly</th>
            <th>Precip mm</th>
            <th>Wind max</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</body>
</html>
