[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "city-weather-pipeline"
version = "0.1.0"
description = "Scheduled Open-Meteo ingestion into layered Postgres (raw -> staging -> curated), orchestrated with Prefect."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Noor Sbeih" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.1,<4",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "prefect>=2.19,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
weather-pipeline = "weather_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
filterwarnings = [
    "ignore::DeprecationWarning:prefect.*",
    "ignore::PendingDeprecationWarning:prefect.*",
    "ignore:Support for class-based `config`:DeprecationWarning",
]
markers = [
    "integration: needs a real Postgres reachable via DATABASE_URL (run with -m integration)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
